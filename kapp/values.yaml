# Default values for kapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
variant: latest
# Random pod label on every render, so each deploy restarts the pods even when the image tag
# is unchanged (mutable tags with pullPolicy Always). Turn off for GitOps (Argo CD): it makes
# the app always OutOfSync and every sync a rollout; an immutable tag change rolls out anyway.
rollme: true
image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

initContainers: []
# - name: init-myservice
#   image: busybox
#   command: ['sh', '-c', 'echo init']

extraEnvs:
  - name: "ENV_TEST"
    value: "TEST"

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Holds off liveness and readiness until the app has started: up to
# periodSeconds * failureThreshold (default 3 min). With it on, liveness/readiness
# need no initialDelaySeconds.
startupProbe:
  enabled: false
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36
livenessProbe:
  enabled: false
  initialDelaySeconds: 600
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 2
readinessProbe:
  enabled: false
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 2

# Time between SIGTERM and SIGKILL; null keeps the Kubernetes default (30s). Raise it for
# apps that finish in-flight work on SIGTERM (e.g. SQS consumers).
terminationGracePeriodSeconds: null

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 80


ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  # targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
  # targetCPU: 2000m
  # targetMemory: 2Gi

nodeSelector: {}

tolerations: []


podDisruptionBudget:
  enabled: false
  # One of the following should be set; if neither is set, the template defaults to minAvailable: 1
  # minAvailable: 1
  # maxUnavailable: 1
  annotations: {}
